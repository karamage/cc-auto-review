[package]
name = "cc-auto-review"
version = "0.1.0"
description = "A desktop app that reviews GitHub pull requests with your local Claude Code"
license = "MIT"
edition = "2021"

[lib]
name = "cc_auto_review_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde_json = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
