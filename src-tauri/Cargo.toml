[package]
name = "cc-auto-review"
version = "0.3.0"
description = "A desktop app that reviews GitHub pull requests with your local Claude Code"
license = "MIT"
edition = "2021"

[lib]
name = "cc_auto_review_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 既定の feature のうち、同梱の画面の圧縮（splash だけで 2 KB）、実行時の権限の組み立て（権限を使わない）、
# Linux 向けの x11 / dbus は要らないので外す
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6"] }
serde_json = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
