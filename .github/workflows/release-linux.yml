name: Release Linux

on:
  # 公開されたリリースに、Linux 向けのパッケージを添付する
  release:
    types: [published]
  # 手動実行と PR では作るだけで、添付しない
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release-linux.yml
      - scripts/build-server.ts
      - scripts/smoke-sidecar.sh
      - src-tauri/**

permissions:
  contents: read

jobs:
  build:
    # glibc が古いほど多くのディストリビューションで動く
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      # 公開リポジトリの CI なので、アクションはタグではなくコミットで固定する
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-12 g++-12 libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev libfuse2 patchelf file
      - run: bun install --frozen-lockfile
      # タグと版がずれたままのパッケージを出さない
      - name: Check the version against the tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "$TAG" = "v$(jq -r .version package.json)"
      # txiki.js が同梱する ada は constexpr の std::string を使うので、22.04 既定の GCC 11 ではビルドできない。
      # GCC 12 は txiki.js の #pragma region を知らず、-Werror で止まる。折りたたみ用の印なので警告を切る
      - run: bun run app:build:linux
        env:
          CC: gcc-12
          CXX: g++-12
          CFLAGS: -Wno-unknown-pragmas
      - run: scripts/smoke-sidecar.sh src-tauri/binaries/cc-auto-review-server-x86_64-unknown-linux-gnu
      - name: Collect packages
        run: |
          version="$(jq -r .version package.json)"
          mkdir out
          cp src-tauri/target/release/bundle/appimage/*.AppImage "out/CC-Auto-Review_${version}_x64.AppImage"
          cp src-tauri/target/release/bundle/deb/*.deb "out/CC-Auto-Review_${version}_x64.deb"
          cd out
          for file in *; do sha256sum "$file" > "$file.sha256"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x64
          path: out/*
          if-no-files-found: error

  attach:
    # 書き込みの権限は、リリースに添付するこのジョブにだけ渡す
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-x64
          path: out
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" out/* --clobber
