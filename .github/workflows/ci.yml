name: CI

on:
  push:
    branches: [main]
  pull_request:

# fork からの PR でも動くので、リポジトリには読み取りしか許さない
permissions:
  contents: read

jobs:
  check:
    # テストは本物の gh / claude / git を呼ばないので、macOS でなくてよい
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 公開リポジトリの CI なので、アクションはタグではなくコミットで固定する
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
